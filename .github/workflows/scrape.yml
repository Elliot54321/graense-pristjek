# Scrape every shop once a day and save to Supabase.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, SCRAPER_CONTACT_EMAIL
#
# Run it by hand from the Actions tab with "Run workflow".
name: Daily scrape

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 03:00/04:00 Danish time, when shops are quiet
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scrape this many products per shop (empty = all)"
        required: false
        default: ""

# Never let two runs of the same shop overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # a full run takes ~130 min at one request every 2 s
    strategy:
      fail-fast: false # one broken shop must not stop the others
      matrix:
        shop: [poetzsch, bordershop]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lock file is made on macOS and lacks some Linux-only
      # optional packages, which makes `npm ci` refuse to install.
      - run: npm install --no-audit --no-fund
      - run: npm run scrape -- ${{ matrix.shop }} --save ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
      # Keep the raw JSON for a week, handy when a run looks wrong.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scrape-${{ matrix.shop }}
          path: data/scrapes/
          retention-days: 7
          if-no-files-found: ignore
