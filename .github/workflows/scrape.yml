# Scrape every shop once a day, save to Supabase, match products by EAN, then
# match new products (families, cross-shop links) with Claude.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY, SCRAPER_CONTACT_EMAIL, ANTHROPIC_API_KEY
#
# Run it by hand from the Actions tab with "Run workflow".
name: Daily scrape

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 03:00/04:00 Danish time, when shops are quiet
  workflow_dispatch:
    inputs:
      limit:
        description: "Only scrape this many products per shop (empty = all)"
        required: false
        default: ""

# Never let two runs of the same shop overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ScandiPark takes ~4 h at one request every 2 s; GitHub's limit is 360
    strategy:
      fail-fast: false # one broken shop must not stop the others
      matrix:
        shop: [poetzsch, bordershop, bordershop-rostock, scandipark]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lock file is made on macOS and lacks some Linux-only
      # optional packages, which makes `npm ci` refuse to install.
      - run: npm install --no-audit --no-fund
      - run: npm run scrape -- ${{ matrix.shop }} --save ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
      # Keep the raw JSON for a week, handy when a run looks wrong.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scrape-${{ matrix.shop }}
          path: data/scrapes/
          retention-days: 7
          if-no-files-found: ignore

  # Link newly seen products by EAN once all shops are scraped. Runs even if
  # one shop failed, so the other shop's new products still get matched.
  match:
    needs: scrape
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run match:ean
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  # Give new products a family (and link them across shops) with Claude, so they
  # show up in search. Its own job: if it fails (e.g. expired API key or no credit
  # left), the scraped prices are already saved and GitHub emails the failure.
  match-new:
    needs: match
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # At most 20 chunks (~800 products, ~$1) a night; a big batch of new products
      # (e.g. a new shop) is then spread over several nights instead of failing at once.
      - run: npm run match:new -- --limit-chunks 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # What was linked and what became a suggestion, kept for a week.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: match-new
          path: data/llm-batches/last-new-links.txt
          retention-days: 7
          if-no-files-found: ignore
